<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Geo Studio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123a63"/>
      <stop offset="0.55" stop-color="#0f3255"/>
      <stop offset="1" stop-color="#0b2743"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.32" cy="0.26" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="globeClip">
      <circle cx="256" cy="250" r="150"/>
    </clipPath>
  </defs>

  <!-- App tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#sheen)"/>

  <!-- Globe graticule (clipped to the sphere) -->
  <g clip-path="url(#globeClip)" fill="none" stroke="#8fd0ff" stroke-width="6">
    <circle cx="256" cy="250" r="150"/>
    <ellipse cx="256" cy="250" rx="62" ry="150"/>
    <ellipse cx="256" cy="250" rx="113" ry="150"/>
    <line x1="106" y1="250" x2="406" y2="250"/>
    <line x1="106" y1="178" x2="406" y2="178"/>
    <line x1="106" y1="322" x2="406" y2="322"/>
  </g>

  <!-- Crosshair -->
  <g stroke="#cfe8ff" stroke-width="14" stroke-linecap="round">
    <line x1="256" y1="66" x2="256" y2="434"/>
    <line x1="72" y1="250" x2="440" y2="250"/>
  </g>
  <!-- Crosshair end caps -->
  <g stroke="#cfe8ff" stroke-width="14" stroke-linecap="round">
    <line x1="230" y1="66"  x2="282" y2="66"/>
    <line x1="230" y1="434" x2="282" y2="434"/>
    <line x1="72"  y1="224" x2="72"  y2="276"/>
    <line x1="440" y1="224" x2="440" y2="276"/>
  </g>

  <!-- Center target dot -->
  <circle cx="256" cy="250" r="34" fill="#EA580C" stroke="#ffffff" stroke-width="10"/>
</svg>
